# Hopeling builds in the cloud - both stores, no Mac required.
# Codemagic (codemagic.io) reads this file from the repo root:
# iOS builds on rented Macs and delivers to TestFlight; Android
# builds a signed app bundle for the Play internal track. Full
# walkthrough: RELEASE.md.
#
# One-time setup after Apple Developer enrollment completes:
#   1. App Store Connect (appstoreconnect.apple.com) -> Users and
#      Access -> Integrations -> App Store Connect API -> generate a
#      key with App Manager role. Note the Key ID, Issuer ID, and
#      download the .p8 file (only downloadable once).
#   2. Codemagic -> Teams -> Integrations -> Developer Portal ->
#      connect with that key. Codemagic then creates and manages the
#      signing certificates and profiles automatically.
#   3. App Store Connect -> Apps -> "+" -> New App:
#      bundle id app.hopeling.hopeling, name Hopeling.
#   4. Codemagic -> add this repo -> it detects codemagic.yaml ->
#      run the ios-testflight workflow.
#   5. TestFlight (App Store Connect -> the app -> TestFlight):
#      add both iPhones' Apple IDs as internal testers.

workflows:
  ios-testflight:
    name: iOS -> TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - signing # CERTIFICATE_PRIVATE_KEY - an RSA private key
                  # generated on Yakir's machine (RELEASE.md), used
                  # by Apple's API to mint the distribution
                  # certificate. Set in Codemagic UI, marked Secure.
    integrations:
      app_store_connect: hopeling # injects the API key env vars
    working_directory: app
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Run the constitution (tests)
        script: flutter test
      - name: Set up code signing (explicit, so errors are readable)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files \
            "app.hopeling.hopeling" \
            --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build signed ipa
        script: |
          # every upload needs a unique, increasing build number;
          # Codemagic's BUILD_NUMBER counts this app's builds
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      # both spellings: relative to working_directory AND to the
      # clone root - whichever this Codemagic version resolves,
      # the ipa is found
      - build/ios/ipa/*.ipa
      - app/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-internal:
    name: Android -> signed bundle
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      flutter: stable
      groups:
        - keystore # CM_KEYSTORE (base64 of hopeling.jks),
                   # CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS,
                   # CM_KEY_PASSWORD - set ONLY in the Codemagic
                   # UI (Environment variables, group "keystore",
                   # all marked Secure). Never in this file.
    working_directory: app
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Run the constitution (tests)
        script: flutter test
      - name: Recreate keystore + key.properties from secrets
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > android/hopeling.jks
          cat > android/key.properties <<EOF
          storeFile=../hopeling.jks
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Build signed app bundle
        script: flutter build appbundle --release --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - app/build/app/outputs/bundle/release/*.aab
